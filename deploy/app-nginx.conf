# Statisches Ausliefern der PWA in der Vibe-Coding-LXC.
#
# Nur HTTP und nur intern erreichbar — TLS macht NPMplus davor.
#   apt install nginx
#   cp deploy/app-nginx.conf /etc/nginx/sites-available/cam-viewer
#   ln -s /etc/nginx/sites-available/cam-viewer /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Deploy der App:  cd app && npm ci && npm run build
#                  rsync -a --delete dist/ root@LXC:/var/www/cam-viewer/

server {
    listen 8080;
    server_name _;
    root /var/www/cam-viewer;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kameraliste nie cachen — sonst siehst du nach einer Änderung
    # tagelang die alte Konfiguration.
    location = /cams.json {
        add_header Cache-Control "no-store";
    }

    # Gehashte Assets dürfen dagegen ewig im Cache bleiben.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
