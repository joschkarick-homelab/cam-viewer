# ═══════════════════════════════════════════════════════════════════
#  NPMplus — Proxy Host für cam.DEINE-DOMAIN.tld
#  Einfügen unter: Proxy Host → Advanced → Custom Nginx Configuration
# ═══════════════════════════════════════════════════════════════════
#
#  Forward Hostname/IP : <LXC-IP>
#  Forward Port        : 8091          (bzw. dein HOST_PORT)
#  Websockets Support  : AN
#  SSL                 : Zertifikat + "Force SSL"
#
# Das ist alles, was hier von Hand konfiguriert werden muss. Das
# Weiterreichen von /api an go2rtc erledigt der nginx IM Container
# (siehe nginx.conf im Repo) — inklusive der langen WebSocket-Timeouts.
# Damit liegt der fehleranfällige Teil versioniert im Git und wird
# automatisch mitdeployt, statt hier in einem Textfeld zu leben.
#
# Konzept: EIN Hostname für innen und außen.
#
#   Intern  (192.168.2.0/24) → kein Login, WebRTC, ~0,3 s Latenz
#   Extern  (alles andere)   → authentik-Login, MSE, ~1 s Latenz
#
# Warum auch intern über den Proxy, wo du innen sonst keinen hast?
# Wegen HTTPS. Wake Lock (Bildschirm anlassen) und getUserMedia (Mikro)
# laufen nur im Secure Context. Über http://192.168.2.x geht der
# Bildschirm nach ein paar Minuten aus — genau das, was du nicht willst.
#
# VORAUSSETZUNG: internes DNS muss cam.DEINE-DOMAIN.tld auf die LAN-IP
# von NPMplus auflösen (Split-Horizon). Ohne das laufen interne Clients
# über den Internet-Umweg und bekommen fälschlich den Login.
#
# ANPASSEN: AUTHENTIK_IP (z.B. 192.168.2.20:9000) und ggf. das LAN-Netz.
# ═══════════════════════════════════════════════════════════════════

location /outpost.goauthentik.io {
    proxy_pass          http://AUTHENTIK_IP/outpost.goauthentik.io;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Original-URL    $scheme://$http_host$request_uri;
    add_header          Set-Cookie        $auth_cookie;
    auth_request_set    $auth_cookie      $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header    Content-Length    "";
}

location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$request_uri;
}

location / {
    # "satisfy any" ist der Kern: erfüllt der Client EINE der Bedingungen,
    # ist er durch. LAN-IP genügt, dann wird auth_request übersprungen.
    # Von außen greift authentik.
    satisfy any;
    allow 192.168.2.0/24;
    deny  all;

    auth_request     /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @goauthentik_proxy_signin;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header       Set-Cookie   $auth_cookie;

    # Ziel ist der Container in der LXC. Trägst du oben schon als
    # "Forward Hostname/IP" ein — NPMplus setzt das selbst ein.
    proxy_pass       $forward_scheme://$server:$port;

    # Der MSE-Stream läuft von außen durch diesen Block hindurch.
    # Ohne die langen Timeouts reißt das Bild jede Minute ab.
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering    off;
}
