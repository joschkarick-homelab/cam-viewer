# ═══════════════════════════════════════════════════════════════════
#  NPMplus — Proxy Host für cam.DEINE-DOMAIN.tld
#  Einfügen unter: Proxy Host → Advanced → Custom Nginx Configuration
# ═══════════════════════════════════════════════════════════════════
#
# Konzept: EIN Hostname für innen und außen.
#
#   Intern  (192.168.2.0/24) → kein Login, WebRTC, ~0,3 s Latenz
#   Extern  (alles andere)   → authentik-Login, MSE, ~1 s Latenz
#
# Warum überhaupt intern über den Proxy, wo du innen sonst keinen hast?
# Wegen HTTPS. Wake Lock (Bildschirm anlassen) und getUserMedia (Mikro)
# laufen nur im Secure Context. Über http://192.168.2.x geht der
# Bildschirm nach ein paar Minuten aus — genau das, was du nicht willst.
# NPMplus hat schon ein gültiges Zertifikat, also nutzen wir das.
#
# VORAUSSETZUNG: internes DNS muss cam.DEINE-DOMAIN.tld auf die LAN-IP
# von NPMplus auflösen (Split-Horizon, z.B. in Pi-hole/AdGuard/OPNsense).
# Ohne das laufen interne Clients über den Internet-Umweg und bekommen
# fälschlich den Login.
#
# ANPASSEN: die drei Platzhalter unten.
#   AUTHENTIK_IP  z.B. 192.168.2.20:9000
#   APP_HOST      LXC mit der PWA, z.B. 192.168.2.30:8080
#   GO2RTC_HOST   Scrypted-VM, z.B. 192.168.2.10:1984
# ═══════════════════════════════════════════════════════════════════

# ── authentik Outpost ──────────────────────────────────────────────
location /outpost.goauthentik.io {
    proxy_pass          http://AUTHENTIK_IP/outpost.goauthentik.io;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Original-URL    $scheme://$http_host$request_uri;
    add_header          Set-Cookie        $auth_cookie;
    auth_request_set    $auth_cookie      $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header    Content-Length    "";
}

location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$request_uri;
}

# ── Die App ────────────────────────────────────────────────────────
location / {
    # "satisfy any" ist der Kern des Ganzen: erfüllt der Client EINE
    # der Bedingungen, ist er durch. LAN-IP genügt, dann wird
    # auth_request übersprungen. Von außen greift authentik.
    satisfy any;
    allow 192.168.2.0/24;
    deny  all;

    auth_request     /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @goauthentik_proxy_signin;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header       Set-Cookie   $auth_cookie;

    proxy_pass http://APP_HOST;
}

# ── go2rtc-API ─────────────────────────────────────────────────────
location /api/ {
    satisfy any;
    allow 192.168.2.0/24;
    deny  all;

    auth_request     /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @goauthentik_proxy_signin;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header       Set-Cookie   $auth_cookie;

    proxy_pass http://GO2RTC_HOST;

    # WebSocket für den MSE-Pfad
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;

    # ⚠ DAS HIER IST DER WICHTIGE TEIL ⚠
    # nginx kappt inaktive Verbindungen nach 60 s. Der MSE-WebSocket
    # sendet aber nur Videodaten, keine Keepalives — von außen würde
    # das Bild also jede Minute abreißen. Genau der Fehler, den eine
    # Babycam nicht machen darf. 24 h Timeout schaltet das ab.
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;

    # Streaming darf nicht gepuffert werden, sonst steigt die Latenz
    # und der Watchdog schlägt grundlos Alarm.
    proxy_buffering off;
}
