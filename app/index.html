<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Cams</title>
  <!-- crossorigin ist hinter authentik Pflicht: ein Manifest wird sonst
       OHNE Cookies angefordert, landet damit beim Login-Redirect und
       scheitert mit "TypeError: Load failed". Ohne Manifest gibt es
       keine Installation als App. -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <!-- Vollbild ohne Safari-Leisten, wenn vom Homescreen gestartet -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cams">
</head>
<body>
  <header id="bar"></header>
  <main id="app" data-focus=""></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
