# go2rtc — Streaming-Gateway für die Tapo-Cams
#
# Läuft auf der (ehemaligen) Scrypted-VM.
# Binary: https://github.com/AlexxIT/go2rtc/releases  → /usr/local/bin/go2rtc
# Config gehört nach /etc/go2rtc/go2rtc.yaml (siehe deploy/go2rtc.service)
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ AUSFÜLLEN VOR DEM START:                                        │
# │  1. KAMERAKONTO + PASSWORT  → für die rtsp://-Zeilen unten      │
# │  2. candidates              → die LAN-IP DIESER VM              │
# └─────────────────────────────────────────────────────────────────┘
#
# Das KAMERAKONTO legst du in der Tapo-App an:
#   Geräteeinstellungen → Erweitert → Kamerakonto
# Es ist NICHT das TP-Link-Konto-Passwort. Warum die Streams auf rtsp://
# und nicht auf tapo:// stehen, steht ausführlich bei "streams:" —
# kurz: über tapo:// bleibt in Safari und auf allen iOS-Geräten das
# Bild schwarz.
#
# Das TP-Link-Konto-Passwort brauchst du nur, falls du die
# tapo://-Zeilen aktivierst. Dann zusätzlich EINMALIG in der Tapo-App:
#   Ich → Tapo Lab → Third-Party Compatibility → AN

api:
  # Nur im LAN lauschen. Der Zugriff von außen läuft über den Reverse
  # Proxy in der Vibe-Coding-LXC, nicht direkt hierher.
  listen: ":1984"
  origin: "*" # CORS — nur nötig, solange App und go2rtc getrennte Origins sind.
    # Sobald der Proxy /api/* durchreicht (siehe deploy/), auf "" setzen.

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555" # TCP + UDP
  candidates:
    # Die LAN-IP DIESER VM. Ohne diesen Eintrag findet der Browser im LAN
    # keinen direkten Pfad und fällt unnötig auf MSE zurück.
    # Zieht die VM um, muss der Wert hier mit — und GO2RTC_HOST im Repo.
    #
    # NUR host:port. Kein "/tcp"-Suffix, kein Protokoll davor!
    #
    # Ein Eintrag erzeugt bereits BEIDE Kandidaten: AddCandidate() in
    # internal/webrtc/candidates.go wird ohne Netzwerk aufgerufen und legt
    # daraufhin je einen für tcp und udp an. Ein zusätzliches
    # "192.168.2.166:8555/tcp" ist deshalb nicht nur überflüssig, es ist
    # kaputt: net.SplitHostPort() trennt am letzten Doppelpunkt und prüft
    # den Port nicht, "8555/tcp" landet also wörtlich als Portnummer im
    # SDP. Chrome verwirft daraufhin die GESAMTE Answer mit
    # "Invalid port" — alle Kameras schwarz, nicht nur der TCP-Pfad.
    - 192.168.2.166:8555

# ── Kameras ────────────────────────────────────────────────────────
#
# tapo:// verbindet DIREKT zur Cam auf Port 8800 — kein Cloud-Traffic.
# Das Cloud-Passwort ist reines Credential, es wird lokal gehasht
# (MD5/SHA256 je nach Firmware) und per RFC-7616-Digest geprüft.
# Vorteil gegenüber rtsp://: Mikrofon-Rückkanal ist möglich.
# Tapo kann nur ONVIF Profile S — über RTSP gibt es keinen Backchannel.
#
# ── Welches Passwort? ──────────────────────────────────────────────
#
# Das Passwort deines TP-LINK-/TAPO-KONTOS — das, mit dem du dich in
# der App mit deiner E-Mail-Adresse anmeldest.
#
# NICHT das "Kamerakonto" aus Geräteeinstellungen → Erweitert. Das ist
# ein separater Benutzer, den du selbst anlegst, und er gilt nur für
# RTSP — also ausschließlich für die auskommentierten rtsp://-Zeilen
# unten. Die beiden zu verwechseln ist der häufigste Grund, warum
# tapo:// scheitert.
#
# Nirgends ablesbar. Wenn du es nicht mehr weißt: in der App unter
# Ich → Konto zurücksetzen. Sind die Cams über ein geteiltes Konto
# eingerichtet, gilt das Passwort des BESITZERS, nicht das deines
# Gastzugangs.
#
# ── Klartext vermeiden (optional) ──────────────────────────────────
#
# Statt des Passworts nimmt go2rtc auch dessen Hash in Großbuchstaben.
# Das "admin:" davor ist dabei PFLICHT:
#
#   tapo://admin:GROSSBUCHSTABEN-HASH@192.168.2.52   ← richtig
#   tapo://GROSSBUCHSTABEN-HASH@192.168.2.52         ← "unauthorized"
#
# Ohne Benutzernamen landet der Wert in Go's URL-Parsing als Username
# mit leerem Passwort, und genau darauf prüft pkg/tapo/client.go: ein
# einzelnes Credential gilt immer als KLARTEXT-Passwort und wird von
# go2rtc noch einmal gehasht. Dein Hash wird dann gehasht.
#
# Hash erzeugen (liest verdeckt, landet nicht in der Shell-History):
#
#   read -rs -p 'Tapo-Passwort: ' p && echo && \
#     printf '%s' "$p" | sha256sum | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]'; unset p
#
# printf, nicht echo — echo hängt ein \n an und hasht es mit. Das
# Ergebnis sieht aus wie ein gültiger Hash und wird trotzdem abgelehnt.
#
# MD5 oder SHA256? Das entscheidet die KAMERA, nicht das Modell: meldet
# sie encrypt_type="3", ist es SHA256, sonst MD5. In der Klartextform
# prüft go2rtc das selbst ab — in der Hashform musst du es treffen, und
# ein falscher Algorithmus sieht exakt wie ein falsches Passwort aus.
# Deshalb: erst mit Klartext verifizieren, dass die Cam überhaupt läuft,
# dann auf den Hash umstellen. Für MD5 oben md5sum statt sha256sum.
#
# Was das bringt und was nicht: gegenüber der KAMERA ist der Hash
# passwortäquivalent, dort gewinnst du nichts. Aber dein
# TP-Link-KONTOPASSWORT steht nicht mehr im Klartext auf der Platte —
# und das ist der Zugang zu allen deinen TP-Link-Geräten.
#
# ── Wenn es trotzdem nicht geht ────────────────────────────────────
#
#  1. Third-Party Compatibility in der App an? (siehe Kopf der Datei)
#  2. Firmware: einzelne Versionen sprechen das Protokoll nicht.
#     Symptom: "Unable to find token in response".
#
# Dann die rtsp://-Zeile der betroffenen Cam aktivieren — dort gilt das
# KAMERAKONTO. Alles läuft außer dem Mikrofon-Rückkanal.

streams:
  # ┌───────────────────────────────────────────────────────────────┐
  # │ WARUM rtsp:// UND NICHT tapo://                                │
  # └───────────────────────────────────────────────────────────────┘
  #
  # tapo:// liefert keine fmtp-Zeile. go2rtc kennt damit weder SPS noch
  # PPS und schreibt beim Bau des MP4-Containers einen PLATZHALTER —
  # pkg/mp4/muxer.go:
  #
  #   // some dummy SPS and PPS not a problem for MP4, but problem for HLS :(
  #   sps = []byte{0x67, 0x42, 0x00, 0x0a, 0xf8, 0x41, 0xa2}
  #
  # Das ist Baseline Level 1.0 und ergibt 128x96. Chrome liest die
  # echten Parameter aus dem Datenstrom nach und spielt trotzdem ab.
  # Safari — macOS wie iOS — initialisiert seinen Dekoder strikt aus dem
  # Init-Segment und bricht dann mit MEDIA_ERR_DECODE ab. Bild bleibt
  # schwarz, auf allen Apple-Geräten, über MSE.
  #
  # rtsp:// liefert sprop-parameter-sets, damit den echten SPS und damit
  # ein korrektes Init-Segment. Kostet den Mikrofon-Rückkanal, den es
  # ohnehin noch nicht gibt — Tapo kann nur ONVIF Profile S.
  #
  # ANMELDUNG: rtsp:// nutzt das KAMERAKONTO aus der Tapo-App
  # (Geräteeinstellungen → Erweitert → Kamerakonto), NICHT das
  # TP-Link-Konto-Passwort. Das ist genau andersherum als bei tapo://.
  #
  # Wenn der Rückkanal kommt: tapo:// als zusätzlichen Stream-Namen
  # anlegen und nur dafür verwenden, statt hier umzuschalten.

  # ┌───────────────────────────────────────────────────────────────┐
  # │ WARUM JE EINE ZWEITE ffmpeg:-ZEILE                             │
  # └───────────────────────────────────────────────────────────────┘
  #
  # Ohne sie gibt es über MSE — also von außen — KEINEN TON.
  #
  # Die Cams liefern G.711 A-law. Im Producer von /api/streams steht:
  #
  #   "medias": ["video, recvonly, H264", "audio, recvonly, PCMA/8000"]
  #   "codec":  { "codec_name": "pcm_alaw", "sample_rate": 8000 }
  #
  # PCMA ist für WebRTC ein Pflichtcodec — im LAN läuft der Ton deshalb
  # ohne Zutun. In einen MP4-Container passt PCMA aber nicht. go2rtc kann
  # nach FLAC umpacken, und genau da endet es: Safaris
  # ManagedMediaSource nimmt FLAC nicht an. In der Diagnose der App ist
  # das direkt ablesbar — "offeredCodecs" enthält kein flac, und in der
  # Folge steht in "negotiatedCodecs" GAR KEIN Audioteil. Kein Audioteil
  # heißt: es gibt keine Tonspur, die man lautstellen könnte. Der
  # Ton-Schalter geht an und es passiert nichts.
  #
  # Bleibt AAC, und das erzeugt ffmpeg.
  #
  # Als Eingabe steht der STREAM-NAME, nicht noch einmal die rtsp://-URL.
  # Beides ist erlaubt, aber der Stream-Name lässt ffmpeg aus dem bereits
  # offenen Datenstrom von go2rtc lesen — die Kamera sieht weiterhin nur
  # EINE RTSP-Sitzung. Mit der URL wäre es eine zweite, bei sechs Streams
  # also zwölf statt sechs.
  #
  # Nur "#audio=aac", kein "#video=...": wird ein Medientyp angegeben,
  # lässt ffmpeg den anderen weg. Diese Quelle liefert also ausschließlich
  # die Tonspur. Das Bild kommt unverändert aus der rtsp://-Zeile darüber,
  # wird nicht angefasst und kostet keine CPU.
  #
  # go2rtc sucht sich pro Client aus beiden Quellen zusammen, was passt
  # ("multi-source codec negotiation"): WebRTC nimmt weiter das
  # unveränderte PCMA, MSE bekommt das AAC. HomeKit bleibt ebenfalls
  # unberührt und transkodiert wie bisher nach OPUS. Der ffmpeg-Prozess
  # startet erst, wenn ihn wirklich jemand braucht.
  #
  # VORAUSSETZUNG: ffmpeg muss auf der VM liegen ("which ffmpeg").
  # Läuft HomeKit mit Ton, ist es fast sicher schon da — dafür wird
  # ebenfalls aus PCMA gewandelt.

  schlafzimmer:
    - rtsp://KAMERAKONTO:PASSWORT@192.168.2.52:554/stream1
    - ffmpeg:schlafzimmer#audio=aac
    # - tapo://TAPO_CLOUD_PASSWORD@192.168.2.52   # kein Bild in Safari

  kinderzimmer:
    - rtsp://KAMERAKONTO:PASSWORT@192.168.2.115:554/stream1
    - ffmpeg:kinderzimmer#audio=aac
    # - tapo://TAPO_CLOUD_PASSWORD@192.168.2.115  # kein Bild in Safari

  springer:
    - rtsp://KAMERAKONTO:PASSWORT@192.168.2.35:554/stream1
    - ffmpeg:springer#audio=aac
    # - tapo://TAPO_CLOUD_PASSWORD@192.168.2.35   # kein Bild in Safari

  # Substreams (VGA) für das Fire Tablet 7. Eigene Stream-Namen, damit
  # das Tablet gezielt darauf zugreifen kann, ohne dass die anderen
  # Geräte Auflösung verlieren.
  # Bei RTSP ist das /stream2 statt /stream1 — kein ?subtype=1.
  schlafzimmer_sd:
    - rtsp://KAMERAKONTO:PASSWORT@192.168.2.52:554/stream2
    - ffmpeg:schlafzimmer_sd#audio=aac
  kinderzimmer_sd:
    - rtsp://KAMERAKONTO:PASSWORT@192.168.2.115:554/stream2
    - ffmpeg:kinderzimmer_sd#audio=aac
  springer_sd:
    - rtsp://KAMERAKONTO:PASSWORT@192.168.2.35:554/stream2
    - ffmpeg:springer_sd#audio=aac

# ── HomeKit ────────────────────────────────────────────────────────
#
# Ersetzt Scrypteds HomeKit-Bridge.
#
# WICHTIG vor dem Aktivieren:
#  1. Cams ZUERST aus Scrypteds HomeKit-Bridge entfernen. Ein Gerät
#     kann nur mit einem Ökosystem gepairt sein.
#  2. Die Cams tauchen danach als NEUE Geräte in Home auf —
#     Raumzuordnung und Automationen musst du neu setzen.
#  3. mDNS muss zwischen dieser VM und den Apple-Geräten funktionieren.
#     Bei getrennten VLANs braucht es einen mDNS-Reflector.
#  4. HomeKit verlangt OPUS-Audio, Tapo liefert G.711/PCMA → go2rtc
#     transkodiert per FFmpeg. Das kostet CPU. Wenn dir das zu teuer
#     ist: Audio hier weglassen und Ton nur über die App hören.
#
# PINs frei wählbar, Format 8 Ziffern. Beim Pairing in der Home-App
# manuell eingeben ("Weitere Optionen" → Code eingeben).

homekit:
  schlafzimmer:
    pin: 11122333
    name: Babycam Schlafzimmer
  kinderzimmer:
    pin: 11122444
    name: Babycam Kinderzimmer
  springer:
    pin: 11122555
    name: Springer-Cam

log:
  level: info
  # Beim Ersteinrichten hilfreich, danach wieder rausnehmen:
  # streams: debug
  # webrtc: debug
