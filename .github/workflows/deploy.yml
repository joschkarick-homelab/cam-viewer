name: Deploy to Homelab

on:
  workflow_run:
    workflows: ["Build & Push Docker Image"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      # Fehlt ein Secret, meldet die Tailscale-Action nur "Please provide
      # either an auth key, OAuth secret and tags, ...". Das sagt weder,
      # WELCHER Wert fehlt, noch dass überhaupt einer leer ist — GitHub
      # lässt leere Inputs im with:-Block stillschweigend weg. Dieser
      # Schritt macht daraus eine Meldung, die den Weg zur Lösung nennt.
      - name: Preflight — Secrets vorhanden?
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          GO2RTC_HOST: ${{ secrets.GO2RTC_HOST }}
        run: |
          missing=()
          for key in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_USER DEPLOY_HOST DEPLOY_PATH; do
            [ -n "${!key}" ] || missing+=("$key")
          done

          # Diese beiden sind optional: docker-compose.prod.yml hat für
          # beide einen Default. Der Hinweis erspart die Suche, wenn der
          # Container später auf dem falschen Port oder gegen die falsche
          # go2rtc-Instanz läuft.
          for key in HOST_PORT GO2RTC_HOST; do
            [ -n "${!key}" ] || echo "::warning::$key ist nicht gesetzt — es gilt der Default aus docker-compose.prod.yml."
          done

          # GO2RTC_HOST landet unverändert in "proxy_pass http://…;".
          # Ohne Port proxyt nginx nach 80 statt 1984 — die App lädt
          # normal, nur die Streams bleiben tot. Sieht aus wie ein
          # Kameraproblem, ist aber eine fehlende ":1984".
          if [ -n "$GO2RTC_HOST" ] && ! printf '%s' "$GO2RTC_HOST" | grep -qE '^[A-Za-z0-9._-]+:[0-9]+$'; then
            echo "::error::GO2RTC_HOST muss die Form host:port haben, z.B. 192.168.2.166:1984."
            exit 1
          fi
          if [ -n "$HOST_PORT" ] && ! printf '%s' "$HOST_PORT" | grep -qE '^[0-9]+$'; then
            echo "::error::HOST_PORT muss eine reine Portnummer sein, z.B. 8091."
            exit 1
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Fehlt: ${missing[*]}"
            echo
            echo "Org-Secrets gelten NICHT automatisch für jedes Repo der Org."
            echo "Prüfen unter: Organization → Settings → Secrets and variables"
            echo "→ Actions → <Secret> → Repository access."
            echo "Steht dort 'Selected repositories', muss cam-viewer in der"
            echo "Liste stehen. DEPLOY_PATH ist eine Variable, kein Secret."
            exit 1
          fi
          echo "Alle benötigten Secrets und Variables sind gesetzt."

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Render stack.env from secrets
        env:
          HOST_PORT: ${{ secrets.HOST_PORT }}
          GO2RTC_HOST: ${{ secrets.GO2RTC_HOST }}
        run: |
          keys=(HOST_PORT GO2RTC_HOST)
          : > stack.env
          for key in "${keys[@]}"; do
            value="${!key}"
            [ -z "$value" ] && continue
            printf '%s=%s\n' "$key" "$value" >> stack.env
          done
          echo "Rendered $(wc -l < stack.env) lines into stack.env"

      - name: Copy compose + env to LXC (via Tailscale SSH)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/dev/null \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "mkdir -p ${DEPLOY_PATH}"
          scp -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/dev/null \
              docker-compose.prod.yml stack.env \
              "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Pull image & restart stack (via Tailscale SSH)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/dev/null \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd ${DEPLOY_PATH} \
               && chmod 600 stack.env \
               && docker compose -f docker-compose.prod.yml --env-file stack.env pull \
               && docker compose -f docker-compose.prod.yml --env-file stack.env up -d --remove-orphans \
               && docker image prune -f"
