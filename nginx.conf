# Wird beim Containerstart per envsubst gerendert (${GO2RTC_HOST} kommt
# aus stack.env). Landet dann als /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── go2rtc ──────────────────────────────────────────────────────
    # Same-Origin für die App: der Browser spricht mit /api, nginx leitet
    # an die Scrypted-VM weiter. Spart CORS und hält das Tapo-Setup vom
    # Internet fern.
    location /api/ {
        proxy_pass http://${GO2RTC_HOST};

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # ⚠ Der wichtigste Wert in dieser Datei.
        # nginx kappt inaktive Verbindungen nach 60 s. Der MSE-WebSocket
        # überträgt aber nur Videodaten und keine Keepalives — das Bild
        # würde also jede Minute abreißen. Genau der Fehler, den eine
        # Babycam nicht machen darf.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Kein Puffern: sonst steigt die Latenz und der Watchdog schlägt
        # grundlos Alarm.
        proxy_buffering off;
    }

    # ── Statische App ───────────────────────────────────────────────
    location = /cams.json {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
